name: Validate marketing site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: jewelhire-marketing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:guided-demo-marketing
      - run: npm run build:marketing
      - run: npm audit --audit-level=moderate
