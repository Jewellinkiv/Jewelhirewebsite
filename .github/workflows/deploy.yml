name: Validate and deploy to Cloud Run

# Every pull request and main-branch push validates the production build. A
# production deployment happens only from an explicit workflow dispatch with
# deploy_production checked. Authentication remains keyless via Workload
# Identity Federation.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the validated main branch to production
        required: true
        default: false
        type: boolean
      database_backup_confirmed:
        description: Confirm a current production database backup exists before migrations run
        required: true
        default: false
        type: boolean
      acknowledge_live_email:
        description: Allow deployment when Postmark delivery is live rather than dry-run
        required: true
        default: false
        type: boolean
      legacy_jewelcert_invites_cleared:
        description: Confirm every sent/started legacy JewelCert invite is cancelled before the post-promotion 0024 fence
        required: true
        default: false
        type: boolean

concurrency:
  group: jewelhire-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for WIF OIDC token

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: applicant_signup_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JEWELHIRE_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:applicant_signup_ci_only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:release-controls
      - run: npm run test:team-invite-gate
      - run: npm run test:applicant-signup-hardening
      - run: npm run test:applicant-signup-postgres
      - run: npm run test:jewelcert-claim-hardening
      - run: npm run test:jewelcert-claim-postgres
      - run: npm run test:jewelcert-cutover-postgres
      - run: npm run test:jewelcert-claim-browser
      - run: npm run test:password-reset-hardening
      - run: npm run test:password-reset-postgres
      - run: npm run test:password-reset-browser
      - run: npm run test:account-claim-hardening
      - run: npm run test:account-claim-browser
      - run: npm run test:standalone-billing
      - run: npm run test:standalone-billing-postgres
      - run: npm run test:request-security
      - run: npm run test:hybrid-location-access
      - run: npm run test:hybrid-location-access-postgres
      - run: npm run test:jewellink-sso-hardening
      - run: npm run test:jewellink-sso-postgres
      - run: npm run test:applicant-profile-truthfulness
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npm run qa:notifications
      - run: npm run qa:billing
      - run: npm run qa:legal
      - run: npm run qa:role-model
      - run: npm run qa:public-careers
      - run: npm run qa:jewellink-sso
      - run: npm run qa:jewellink-hire
      - run: npm run qa:jewellink-jewelcert

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: jewelhire-prod-20260626
          workload_identity_provider: projects/806390481450/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-actions-deploy@jewelhire-prod-20260626.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify production rollout prerequisites
        env:
          DATABASE_BACKUP_CONFIRMED: ${{ inputs.database_backup_confirmed }}
          ACKNOWLEDGE_LIVE_EMAIL: ${{ inputs.acknowledge_live_email }}
          LEGACY_JEWELCERT_INVITES_CLEARED: ${{ inputs.legacy_jewelcert_invites_cleared }}
        run: |
          set -euo pipefail
          if [[ "$DATABASE_BACKUP_CONFIRMED" != "true" ]]; then
            echo "A current production database backup must be confirmed before deployment."
            exit 1
          fi
          if [[ "$LEGACY_JEWELCERT_INVITES_CLEARED" != "true" ]]; then
            echo "Every sent/started legacy JewelCert invite must be cancelled before the post-promotion 0024 fence."
            exit 1
          fi

          gcloud run services describe jewelhire \
            --project jewelhire-prod-20260626 \
            --region us-central1 \
            --format=json > /tmp/jewelhire-service.json

          for name in DATABASE_URL AUTH_SECRET JEWELLINK_URL JEWELLINK_SSO_SHARED_SECRET JEWELLINK_INTEGRATION_SHARED_SECRET JEWELHIRE_TEAM_INVITES_ENABLED JEWELHIRE_TRUSTED_PROXY_HOPS JEWELHIRE_REQUIRE_AUTH AUTH_MODE JEWELHIRE_STORAGE JEWELHIRE_ENABLE_SESSION_OVERRIDE EMAIL_NOTIFICATIONS_ENABLED POSTMARK_DRY_RUN POSTMARK_SERVER_TOKEN POSTMARK_FROM_EMAIL POSTMARK_MESSAGE_STREAM STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_STORE_OWNER_MONTHLY_PRICE_ID STRIPE_STORE_OWNER_ANNUAL_PRICE_ID; do
            if ! jq -e --arg name "$name" '.spec.template.spec.containers[0].env[] | select(.name == $name)' /tmp/jewelhire-service.json >/dev/null; then
              echo "Missing required Cloud Run environment setting: $name"
              exit 1
            fi
          done

          MONTHLY_PRICE_ID=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "STRIPE_STORE_OWNER_MONTHLY_PRICE_ID") | .value // ""' /tmp/jewelhire-service.json)
          ANNUAL_PRICE_ID=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "STRIPE_STORE_OWNER_ANNUAL_PRICE_ID") | .value // ""' /tmp/jewelhire-service.json)
          if [[ "$MONTHLY_PRICE_ID" != price_* || "$ANNUAL_PRICE_ID" != price_* || "$MONTHLY_PRICE_ID" == "$ANNUAL_PRICE_ID" ]]; then
            echo "Configure distinct recurring Stripe Price ids for the exact monthly and annual JewelHire offers."
            exit 1
          fi
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            if ! jq -e --arg name "$name" '.spec.template.spec.containers[0].env[] | select(.name == $name) | (.valueSource.secretKeyRef.secret // .valueFrom.secretKeyRef.name // "") | length > 0' /tmp/jewelhire-service.json >/dev/null; then
              echo "${name} must be backed by Secret Manager, not a plaintext Cloud Run value."
              exit 1
            fi
          done

          JEWELLINK_URL=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "JEWELLINK_URL") | .value // ""' /tmp/jewelhire-service.json)
          if [[ "$JEWELLINK_URL" != https://* ]]; then
            echo "JEWELLINK_URL must use HTTPS in production."
            exit 1
          fi

          REQUIRE_AUTH=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "JEWELHIRE_REQUIRE_AUTH") | .value // ""' /tmp/jewelhire-service.json)
          AUTH_MODE_VALUE=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "AUTH_MODE") | .value // ""' /tmp/jewelhire-service.json)
          STORAGE_MODE=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "JEWELHIRE_STORAGE") | .value // ""' /tmp/jewelhire-service.json)
          SESSION_OVERRIDE=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "JEWELHIRE_ENABLE_SESSION_OVERRIDE") | .value // ""' /tmp/jewelhire-service.json)
          if [[ "$REQUIRE_AUTH" != "1" || "$AUTH_MODE_VALUE" != "google" ]]; then
            echo "Production requires JEWELHIRE_REQUIRE_AUTH=1 and AUTH_MODE=google."
            exit 1
          fi
          if [[ "$STORAGE_MODE" != "postgres" || "$SESSION_OVERRIDE" != "0" ]]; then
            echo "Production requires JEWELHIRE_STORAGE=postgres and JEWELHIRE_ENABLE_SESSION_OVERRIDE=0."
            exit 1
          fi

          TEAM_INVITES_ENABLED=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "JEWELHIRE_TEAM_INVITES_ENABLED") | .value // ""' /tmp/jewelhire-service.json)
          if [[ "$TEAM_INVITES_ENABLED" != "0" ]]; then
            echo "JEWELHIRE_TEAM_INVITES_ENABLED must be explicitly 0 for the Diamond Exchange pilot."
            exit 1
          fi

          TRUSTED_PROXY_HOPS=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "JEWELHIRE_TRUSTED_PROXY_HOPS") | .value // ""' /tmp/jewelhire-service.json)
          if [[ ! "$TRUSTED_PROXY_HOPS" =~ ^[0-8]$ ]]; then
            echo "JEWELHIRE_TRUSTED_PROXY_HOPS must be an explicit integer from 0 through 8."
            exit 1
          fi

          for name in DATABASE_URL AUTH_SECRET JEWELLINK_SSO_SHARED_SECRET JEWELLINK_INTEGRATION_SHARED_SECRET POSTMARK_SERVER_TOKEN; do
            if ! jq -e --arg name "$name" '
              .spec.template.spec.containers[0].env[]
              | select(.name == $name)
              | (.valueSource.secretKeyRef // .valueFrom.secretKeyRef)
            ' /tmp/jewelhire-service.json >/dev/null; then
              echo "$name must be backed by Secret Manager."
              exit 1
            fi
          done

          EMAIL_ENABLED=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "EMAIL_NOTIFICATIONS_ENABLED") | .value // "false"' /tmp/jewelhire-service.json)
          POSTMARK_DRY_RUN=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "POSTMARK_DRY_RUN") | .value // "false"' /tmp/jewelhire-service.json)
          if [[ "$EMAIL_ENABLED" != "true" ]]; then
            echo "Verified applicant signup requires EMAIL_NOTIFICATIONS_ENABLED=true before traffic moves."
            exit 1
          fi
          if [[ "$POSTMARK_DRY_RUN" == "true" || "$POSTMARK_DRY_RUN" == "1" ]]; then
            echo "Verified applicant signup cannot deliver its secret token while POSTMARK_DRY_RUN is enabled."
            exit 1
          fi
          if [[ "$ACKNOWLEDGE_LIVE_EMAIL" != "true" ]]; then
            echo "Postmark delivery must be live for verified applicant signup. Check acknowledge_live_email to approve this posture."
            exit 1
          fi

      - name: Create no-traffic candidate revision
        id: candidate
        run: |
          set -euo pipefail
          TAG="candidate-${GITHUB_RUN_ID}"
          PREVIOUS_SERVICE_JSON=$(gcloud run services describe jewelhire --project jewelhire-prod-20260626 --region us-central1 --format=json)
          PREVIOUS_REVISION=$(jq -er '[.status.traffic[] | select(.percent == 100) | .revisionName][0] | select(type == "string" and length > 0)' <<<"$PREVIOUS_SERVICE_JSON")
          gcloud run deploy jewelhire \
            --source . \
            --project jewelhire-prod-20260626 \
            --region us-central1 \
            --no-traffic \
            --tag "$TAG" \
            --quiet

          SERVICE_JSON=$(gcloud run services describe jewelhire --project jewelhire-prod-20260626 --region us-central1 --format=json)
          REVISION=$(jq -er '.status.latestCreatedRevisionName | select(type == "string" and length > 0)' <<<"$SERVICE_JSON")
          TAG_URL=$(jq -er --arg tag "$TAG" '.status.traffic[] | select(.tag == $tag) | .url | select(type == "string" and length > 0)' <<<"$SERVICE_JSON")
          IMAGE=$(gcloud run revisions describe "$REVISION" --project jewelhire-prod-20260626 --region us-central1 --format='value(spec.containers[0].image)')
          [[ "$IMAGE" == *@sha256:* ]]
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "previous_revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"

      - name: Apply rollback-compatible expand migrations through 0023
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          SERVICE_JSON=$(gcloud run services describe jewelhire --project jewelhire-prod-20260626 --region us-central1 --format=json)
          RUNTIME_SERVICE_ACCOUNT=$(jq -r '.spec.template.spec.serviceAccountName // .spec.template.spec.serviceAccount' <<<"$SERVICE_JSON")
          DATABASE_SECRET=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "DATABASE_URL") | (.valueSource.secretKeyRef.secret // .valueFrom.secretKeyRef.name)' <<<"$SERVICE_JSON")
          DATABASE_SECRET_VERSION=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "DATABASE_URL") | (.valueSource.secretKeyRef.version // .valueFrom.secretKeyRef.key // "latest")' <<<"$SERVICE_JSON")
          test -n "$RUNTIME_SERVICE_ACCOUNT" && test -n "$DATABASE_SECRET"

          gcloud run jobs deploy jewelhire-migrate-expand \
            --project jewelhire-prod-20260626 \
            --region us-central1 \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-secrets "DATABASE_URL=${DATABASE_SECRET}:${DATABASE_SECRET_VERSION}" \
            --set-env-vars "APPLY_DATABASE_MIGRATIONS=1,REQUIRE_EXISTING_MIGRATION_LEDGER=1,POSTGRES_POOL_MAX=1" \
            --command /cnb/lifecycle/launcher \
            --args npm,run,db:migrate:apply,--,--through=0023_jewelcert_claim_token_version \
            --max-retries 0 \
            --task-timeout 15m \
            --quiet
          gcloud run jobs execute jewelhire-migrate-expand \
            --project jewelhire-prod-20260626 \
            --region us-central1 \
            --wait

      - name: Smoke no-traffic candidate
        env:
          TAG_URL: ${{ steps.candidate.outputs.tag_url }}
        run: |
          set -euo pipefail
          for path in /login /forgot-password /reset-password /privacy /terms /signup /verify-email /signup/store; do
            STATUS=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --output /dev/null --write-out '%{http_code}' "${TAG_URL}${path}")
            if [[ "$STATUS" != "200" ]]; then
              echo "Candidate ${path} returned ${STATUS}; expected 200."
              exit 1
            fi
          done

      - name: Probe applicant signup provider on no-traffic candidate
        env:
          TAG_URL: ${{ steps.candidate.outputs.tag_url }}
          JEWELHIRE_RELEASE_PROBE_EMAIL: ${{ secrets.JEWELHIRE_RELEASE_PROBE_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -z "$JEWELHIRE_RELEASE_PROBE_EMAIL" ]]; then
            echo "The required JEWELHIRE_RELEASE_PROBE_EMAIL production secret is missing."
            exit 1
          fi

          PROBE_PAYLOAD=$(jq -cn --arg email "$JEWELHIRE_RELEASE_PROBE_EMAIL" '{email: $email}')
          STATUS=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output /tmp/jewelhire-signup-provider-probe.json \
            --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data-binary "$PROBE_PAYLOAD" \
            "${TAG_URL}/api/auth/applicant-signup")
          if [[ "$STATUS" != "202" ]] || ! jq -e '.ok == true' /tmp/jewelhire-signup-provider-probe.json >/dev/null; then
            echo "The no-traffic applicant signup provider probe was not accepted; refusing to move traffic."
            exit 1
          fi

      - name: Move production traffic to candidate
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic jewelhire \
            --project jewelhire-prod-20260626 \
            --region us-central1 \
            --to-revisions "${REVISION}=100" \
            --quiet

      - name: Verify public production routes
        env:
          PREVIOUS_REVISION: ${{ steps.candidate.outputs.previous_revision }}
        run: |
          set -euo pipefail
          FAILED=0
          for path in /login /forgot-password /reset-password /privacy /terms /signup /verify-email /signup/store; do
            STATUS=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --output /dev/null --write-out '%{http_code}' "https://app.jewelhire.com${path}" || true)
            if [[ "$STATUS" != "200" ]]; then
              echo "Production ${path} returned ${STATUS}; expected 200."
              FAILED=1
            fi
          done
          if [[ "$FAILED" == "1" ]]; then
            echo "Production smoke failed; restoring traffic to ${PREVIOUS_REVISION}."
            gcloud run services update-traffic jewelhire \
              --project jewelhire-prod-20260626 \
              --region us-central1 \
              --to-revisions "${PREVIOUS_REVISION}=100" \
              --quiet
            exit 1
          fi

      - name: Apply post-promotion 0024 fence, additive 0025, and final readiness
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          echo "The v2-writing revision owns traffic. After this contract migration, do not restore a pre-v2 revision."
          echo "The same guarded job also applies additive migration 0025 before final readiness; do not initiate standalone checkout until it passes."
          SERVICE_JSON=$(gcloud run services describe jewelhire --project jewelhire-prod-20260626 --region us-central1 --format=json)
          RUNTIME_SERVICE_ACCOUNT=$(jq -r '.spec.template.spec.serviceAccountName // .spec.template.spec.serviceAccount' <<<"$SERVICE_JSON")
          DATABASE_SECRET=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "DATABASE_URL") | (.valueSource.secretKeyRef.secret // .valueFrom.secretKeyRef.name)' <<<"$SERVICE_JSON")
          DATABASE_SECRET_VERSION=$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "DATABASE_URL") | (.valueSource.secretKeyRef.version // .valueFrom.secretKeyRef.key // "latest")' <<<"$SERVICE_JSON")
          test -n "$RUNTIME_SERVICE_ACCOUNT" && test -n "$DATABASE_SECRET"

          gcloud run jobs deploy jewelhire-migrate-contract \
            --project jewelhire-prod-20260626 \
            --region us-central1 \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-secrets "DATABASE_URL=${DATABASE_SECRET}:${DATABASE_SECRET_VERSION}" \
            --set-env-vars "APPLY_DATABASE_MIGRATIONS=1,REQUIRE_EXISTING_MIGRATION_LEDGER=1,POSTGRES_POOL_MAX=1" \
            --command /cnb/lifecycle/launcher \
            --args npm,run,db:migrate:apply \
            --max-retries 0 \
            --task-timeout 15m \
            --quiet
          gcloud run jobs execute jewelhire-migrate-contract \
            --project jewelhire-prod-20260626 \
            --region us-central1 \
            --wait

          gcloud run jobs deploy jewelhire-readiness \
            --project jewelhire-prod-20260626 \
            --region us-central1 \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-secrets "DATABASE_URL=${DATABASE_SECRET}:${DATABASE_SECRET_VERSION}" \
            --set-env-vars "POSTGRES_POOL_MAX=1" \
            --command /cnb/lifecycle/launcher \
            --args npm,run,db:readiness \
            --max-retries 0 \
            --task-timeout 15m \
            --quiet
          gcloud run jobs execute jewelhire-readiness \
            --project jewelhire-prod-20260626 \
            --region us-central1 \
            --wait
